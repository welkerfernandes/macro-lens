name: polyglot-quality
on: [push, pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: rustup toolchain install stable --profile minimal
      - run: cd engines/trend && cargo test && cargo build --release
      - run: python -m pytest -q
        env:
          NATIVE_ENGINE: '["engines/trend/target/release/macro-trend"]'
      - run: npm ci && npm run build
        working-directory: web
      - run: docker build -t local-check .
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: npm install && npm run build
        working-directory: web
      - run: npm install
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - name: Start API and check desktop/mobile flows
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          node ui/smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: docs/*.png
